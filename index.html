<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Stationery Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Online Stationery Store</h1>
        <p> Fetch API and JavaScript</p>
    </header>

    <main>

        <div class="top-bar">

            <input
                type="text"
                id="searchBox"
                placeholder="🔍 Search stationery product..."
            >

            <button id="cartBtn">
                🛒 Cart (<span id="cartCount">0</span>)
            </button>

        </div>

        <p id="status">Loading products...</p>

        <div id="productContainer" class="products"></div>

        <section id="cartSection" class="cart hidden">

            <h2>🛒 Shopping Cart</h2>

            <div id="cartItems"></div>

            <h3>
                Total: ₹<span id="cartTotal">0</span>
            </h3>

            <button id="orderBtn" class="order-btn">
                Place Order
            </button>

        </section>

    </main>

    <footer>
        <p>Online Stationery Ordering System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
